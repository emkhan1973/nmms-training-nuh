<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NMMS INO Training 2026–27 · Nuh</title>
<meta name="description" content="Training-cum-Workshop for INOs under NMMS Scheme (2026–27), Department of School Education, Nuh, Haryana">
<meta name="theme-color" content="#0E2766">
<link rel="preload" as="image" href="assets/nmms-banner.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap">
<style>
/* Layout: official strip → full-width banner → navy navigation → breadcrumb → page content in a 1280px column */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface-2:#EEF2F8; --ink:#16213E; --muted:#56637D; --line:#D6DDE9;
  --navy:#0E2766; --navy-2:#1A3A8F; --on-navy:#FFFFFF; --link:#1A3A8F;
  --green:#1E7B34; --green-soft:#E3F2E7; --saffron:#E8820C; --saffron-soft:#FDF1E1; --saffron-ink:#8A4B00;
  --red:#B42318; --red-soft:#FCE8E6; --amber-soft:#FFF6D6; --amber-ink:#7A5A00;
  --f:"Noto Sans","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --fh:"Noto Sans Devanagari","Noto Sans",system-ui,sans-serif;
  --scale:1; --r:10px; --shadow:0 1px 2px rgba(14,39,102,.06),0 2px 8px rgba(14,39,102,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1222; --surface:#141C31; --surface-2:#1B2540; --ink:#E6EBF5; --muted:#9AA6C2; --line:#2A3656;
  --navy:#0A1C4D; --navy-2:#2D4FB0; --link:#9DB4FF; --green:#5CC77A; --green-soft:#16301F; --saffron:#F5A445;
  --saffron-soft:#352512; --saffron-ink:#F7C98A; --red:#F2827A; --red-soft:#3A1A19; --amber-soft:#332B10; --amber-ink:#F2D27A;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1222; --surface:#141C31; --surface-2:#1B2540; --ink:#E6EBF5; --muted:#9AA6C2; --line:#2A3656;
  --navy:#0A1C4D; --navy-2:#2D4FB0; --link:#9DB4FF; --green:#5CC77A; --green-soft:#16301F; --saffron:#F5A445;
  --saffron-soft:#352512; --saffron-ink:#F7C98A; --red:#F2827A; --red-soft:#3A1A19; --amber-soft:#332B10; --amber-ink:#F2D27A;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--scale));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
h1,h2,h3,h4{line-height:1.25;margin:0;text-wrap:balance}
a{color:var(--link)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Official strip */
.strip{background:var(--navy);color:var(--on-navy);font-size:.82rem;padding-top:env(safe-area-inset-top,0px)}
.strip-in{display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:6px}
.strip-title{min-width:0}
.strip-title b{font-weight:600;display:block}
.strip-title span{opacity:.85}
.strip-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.conn{font-weight:600;font-size:.75rem;padding:2px 10px;border-radius:99px;background:rgba(255,255,255,.14);white-space:nowrap}
.conn.ok::before,.conn.off::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
.conn.ok::before{background:#5CD07A}.conn.off::before{background:#F5A445}
.tbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;min-height:30px;padding:2px 10px;cursor:pointer;font-weight:600;font-size:.8rem}
.tbtn:hover{background:rgba(255,255,255,.22)}

/* Banner */
.banner-wrap{background:#fff;border-bottom:4px solid var(--saffron)}
.banner{display:block;width:100%;height:auto;max-width:1920px;margin:0 auto;object-fit:contain;aspect-ratio:2048/768}
.board-row{display:flex;justify-content:flex-end;padding-block:6px}
.board-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--navy-2);background:var(--navy-2);color:#fff;border-radius:6px;padding:4px 12px;min-height:34px;font-weight:600;font-size:.82rem;cursor:pointer}
.board-btn:hover{filter:brightness(1.1)}

/* Navigation */
.nav{background:var(--navy-2);position:sticky;top:0;z-index:30;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.nav-in{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.nav a{flex:none;color:#fff;text-decoration:none;font-weight:600;font-size:.92rem;padding:12px 14px;border-bottom:3px solid transparent;white-space:nowrap}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a[aria-current="page"]{border-bottom-color:var(--saffron);background:rgba(255,255,255,.1)}
.nav a.adm{color:#FFD9A6}
.nav .sp{flex:1}
.crumbs{list-style:none;display:flex;flex-wrap:wrap;gap:6px;padding:12px 0 0;margin:0;font-size:.85rem;color:var(--muted)}
.crumbs li+li::before{content:"›";margin-right:6px}
.crumbs a{text-decoration:none}

main{padding-block:16px 48px;display:grid;gap:18px}
.page-head{display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap}
.page-head h1{font-size:1.6rem;color:var(--navy-2)}
:root[data-theme="dark"] .page-head h1{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .page-head h1{color:var(--ink)}}
.page-head p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:1.15rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;align-items:start}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:8px;min-height:44px;padding:8px 16px;font-weight:600;cursor:pointer;background:var(--navy-2);color:#fff;text-decoration:none;font-size:.95rem}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.sec:hover{background:var(--surface-2)}
.btn.green{background:var(--green)}
.btn.saff{background:var(--saffron);color:#1E1300}
.btn.danger{background:var(--red);color:#fff}
.btn.lg{min-height:52px;font-size:1.05rem;padding:10px 22px}
.btn.sm{min-height:34px;padding:4px 10px;font-size:.85rem}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap}
.pill.present{background:var(--green-soft);color:var(--green)}
.pill.absent{background:var(--red-soft);color:var(--red)}
.pill.pending{background:var(--amber-soft);color:var(--amber-ink)}
.pill.upcoming,.pill.neutral{background:var(--surface-2);color:var(--muted)}
.pill.tbc{background:var(--saffron-soft);color:var(--saffron-ink)}
.notice{border-radius:8px;padding:12px 14px;border:1px solid;font-size:.92rem}
.notice.info{background:var(--surface-2);border-color:var(--line)}
.notice.warn{background:var(--amber-soft);border-color:#E9CF7A;color:var(--amber-ink)}
.notice.err{background:var(--red-soft);border-color:#F0B4AE;color:var(--red)}
.notice.ok{background:var(--green-soft);border-color:#A8D8B4;color:var(--green)}
.notice.saff{background:var(--saffron-soft);border-color:#F2C58C;color:var(--saffron-ink);font-weight:600}
.field{display:grid;gap:4px;min-width:0}
.field label,.lbl{font-weight:600;font-size:.88rem}
.input,select.input,textarea.input{width:100%;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px}
textarea.input{min-height:88px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;min-height:44px;text-align:left;line-height:1.25}
.seg button small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.seg button[aria-pressed="true"]{border-color:var(--navy-2);background:var(--navy-2);color:#fff}
.seg button[aria-pressed="true"] small{color:#DCE5FF}
.empty{padding:24px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:10px}

/* Welcome message frame */
.msg{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--navy-2);border-radius:var(--r);padding:clamp(18px,3.5vw,40px);box-shadow:var(--shadow);font-family:var(--fh)}
.msg h1{font-size:clamp(1.3rem,2.6vw,1.75rem);color:var(--navy-2);margin-bottom:18px}
.msg h2{font-size:1.15rem;margin:26px 0 8px;color:var(--navy-2)}
:root[data-theme="dark"] .msg h1,:root[data-theme="dark"] .msg h2{color:var(--link)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .msg h1,:root:not([data-theme="light"]) .msg h2{color:var(--link)}}
.msg p,.msg li{font-size:1.05rem;line-height:1.85;max-width:72ch}
.msg p{margin:0 0 12px}
.msg ul{padding-left:1.3em;margin:6px 0 14px}
.msg li{margin-bottom:6px}
.msg .hl{background:var(--saffron-soft);border-left:4px solid var(--saffron);padding:12px 16px;border-radius:6px;font-weight:600}
.msg .sign{margin-top:24px;border-top:1px solid var(--line);padding-top:14px}
.msg .sign b{display:block}
.aside{display:grid;gap:14px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:8px;padding:10px}
.stat b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.78rem;color:var(--muted)}
.links{display:grid;gap:8px}
.links a{display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-weight:600;background:var(--surface)}
.links a:hover{border-color:var(--navy-2)}
.links a span{color:var(--muted);font-weight:400;font-size:.85rem}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-size:.76rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
th button{all:unset;cursor:pointer}
th button:focus-visible{outline:2px solid var(--saffron)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--surface-2)}
.wide{min-width:900px}
.pager{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0}
.thumb{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--surface-2);display:inline-block;vertical-align:middle}
@media (max-width:720px){
  table.cards,table.cards tbody,table.cards tr,table.cards td{display:block;width:100%}
  table.cards thead{display:none}
  table.cards tr{border-bottom:1px solid var(--line);padding:8px 4px}
  table.cards td{border:0;padding:3px 10px;display:grid;grid-template-columns:110px 1fr;gap:8px}
  table.cards td::before{content:attr(data-l);font-weight:600;color:var(--muted);font-size:.8rem}
}

/* Attendance */
.steps{display:flex;gap:6px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.steps li{padding:6px 12px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-size:.85rem;font-weight:600}
.steps li[aria-current="step"]{background:var(--navy-2);color:#fff}
.steps li.done{background:var(--green-soft);color:var(--green)}
.plist{display:grid;gap:8px;max-height:460px;overflow:auto;padding:2px}
.pbtn{display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer;width:100%;align-items:center}
.pbtn:hover{border-color:var(--navy-2)}
.pbtn b{font-size:1rem}
.pbtn span{font-size:.82rem;color:var(--muted);grid-column:1}
.pbtn .pill{grid-row:1/3;grid-column:2}
.verify{display:grid;gap:4px;background:var(--surface-2);border-radius:8px;padding:14px}
.verify b{font-size:1.2rem}
.cam{position:relative;width:100%;max-width:440px;aspect-ratio:1/1;background:#0B1020;border-radius:12px;overflow:hidden;display:grid;place-items:center;color:#fff}
.cam video,.cam img{width:100%;height:100%;object-fit:cover}
.cam video{transform:scaleX(-1)}
.cam .ring{position:absolute;inset:14%;border:3px dashed rgba(255,255,255,.6);border-radius:50%;pointer-events:none}
.cam .ph{display:grid;gap:8px;text-align:center;padding:16px;justify-items:center;color:#C9D3EA}
.consent{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:8px;padding:12px;font-size:.9rem}
.consent input{width:22px;height:22px;flex:none;margin-top:2px}
.success{display:grid;gap:10px;justify-items:center;text-align:center;padding:12px}
.success img{width:140px;height:140px;border-radius:50%;object-fit:cover;border:5px solid var(--green)}
.success .big{font-size:1.4rem;font-weight:700;color:var(--green)}

/* Tests */
.q{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surface)}
.q h3{font-size:1rem;font-weight:600;display:flex;gap:10px;align-items:flex-start}
.q h3 .qn{flex:none;background:var(--navy-2);color:#fff;border-radius:6px;padding:1px 8px;font-size:.85rem}
.q .meta{font-size:.8rem;color:var(--muted);margin:4px 0 10px 0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px;cursor:pointer;background:var(--surface)}
.opt:has(input:checked){border-color:var(--navy-2);background:var(--surface-2)}
.opt input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--navy-2)}
.q.missing{border-color:var(--red);box-shadow:0 0 0 2px var(--red-soft)}
.submitbar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 -4px 14px rgba(0,0,0,.06);margin-bottom:env(safe-area-inset-bottom,0px)}

/* Materials */
.mat-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.mat{display:grid;gap:8px;align-content:start}
.mat .type{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--saffron-ink);background:var(--saffron-soft);border-radius:4px;padding:2px 8px;justify-self:start}
.mat h3{font-size:1.05rem}
.drop{border:2px dashed var(--line);border-radius:10px;padding:24px;text-align:center;background:var(--surface-2)}
.days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.dayc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);min-width:0}
.dayc header{padding:14px 16px;color:#fff;background:var(--navy-2)}
.dayc.d2 header{background:#1E6B3A}.dayc.d3 header{background:#7A4A12}
.dayc header .dd{font-size:.8rem;font-weight:600;opacity:.9;letter-spacing:.03em;text-transform:uppercase}
.dayc header h2{font-size:1.15rem;margin-top:2px;color:#fff}
.dayc .counts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.dayc .counts span{background:rgba(255,255,255,.18);border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:600}
.dayc .counts .today{background:var(--saffron);color:#1E1300}
.folders{list-style:none;margin:0;padding:6px}
.folders a{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:10px;border-radius:8px;text-decoration:none;color:var(--ink)}
.folders a:hover,.folders a:focus-visible{background:var(--surface-2)}
.folders .ico{grid-row:1/3;color:var(--saffron)}
.folders b{font-size:.95rem;line-height:1.3}
.folders small{grid-column:2;color:var(--muted);font-size:.8rem}
.folders .go{grid-row:1/3;grid-column:3;font-size:.8rem;font-weight:600;color:var(--link);white-space:nowrap}
.olinks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.olink{display:grid;gap:8px;align-content:start;border-left:4px solid var(--green)}
.olink .ext{justify-self:start;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--green-soft);color:var(--green);border-radius:4px;padding:2px 8px}
.olink code{font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.res-list{display:grid;gap:10px}
.res{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.res .badge{width:54px;height:54px;border-radius:10px;display:grid;place-items:center;font-size:.7rem;font-weight:700;text-align:center;line-height:1.1;background:var(--surface-2);color:var(--navy-2)}
.res .badge.pdf{background:var(--red-soft);color:var(--red)}.res .badge.video{background:var(--surface-2);color:var(--saffron-ink)}.res .badge.link{background:var(--green-soft);color:var(--green)}
.res h3{font-size:1.02rem}
.res .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.adminbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--saffron-soft);border:1px solid #F2C58C;border-radius:var(--r);padding:10px 12px}
@media (max-width:980px){.days{grid-template-columns:1fr}}
.drop.over{border-color:var(--navy-2)}

/* Dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi span{display:block;font-size:.78rem;color:var(--muted);font-weight:600}
.kpi b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi small{color:var(--muted);font-size:.78rem}
.kpi.good b{color:var(--green)}
.subtabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line)}
.subtabs button{flex:none;border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.subtabs button[aria-selected="true"]{color:var(--navy-2);border-bottom-color:var(--saffron)}
.tt-edit input{min-height:38px;padding:4px 8px}

/* Viewer */
.viewer{position:fixed;inset:0;z-index:80;background:#0B1020;display:flex;flex-direction:column;color:#fff}
.vbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:#121A33;border-bottom:1px solid #26325A}
.vbar .vt{flex:1;min-width:140px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar button{background:#22305C;border:1px solid #34467F;color:#fff;border-radius:6px;min-height:38px;min-width:38px;padding:4px 10px;cursor:pointer;font-weight:600}
.vbar .exit{background:var(--saffron);color:#1E1300;border-color:var(--saffron)}
.vbody{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.vbody canvas{background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.4);max-width:none}
.vbody .doc{background:#fff;color:#111;padding:28px;max-width:900px;width:100%;border-radius:4px;overflow:auto}
.vbody .doc table{color:#111}
.vbody .doc td,.vbody .doc th{border:1px solid #ccc}
.vbody .imgv{max-width:100%;max-height:100%;object-fit:contain;margin:auto}

function fmtDT(iso) { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return iso; return d.toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', hour: 'numeric', minute: '2-digit' }); }
function fmtT(iso) { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return iso; return d.toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: 'numeric', minute: '2-digit' }); }
function fmtSize(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }

async function api(action, payload) {
  if (!CFG.GAS_URL) throw { code: 'not_configured', message: 'The online server is not connected yet (GAS_URL is empty in config.js).' };
  let res;
  try {
    res = await fetch(CFG.GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, token: App.token || undefined }, payload || {})), redirect: 'follow' });
  } catch (e) { throw { code: 'network', message: 'Network problem. Check the internet connection and try again.' }; }
  let j;
  try { j = await res.json(); } catch (e) { throw { code: 'network', message: 'The server sent an unexpected reply (HTTP ' + res.status + '). Please try again.' }; }
  if (!j.ok) {
    if (j.code === 'auth' && App.token && action !== 'login') { App.token = null; store.sset('nmms26_tok', null); App.isAdmin = false; S.admin = null; renderShell(); }
    throw { code: j.code || 'error', message: j.error || 'Request failed.' };
  }
  return j;
}

/* Outbox: attendance and test submissions that failed because of the network are kept on this device and re-sent. */
const OUTBOX = 'nmms26_outbox';
function outbox() { return store.get(OUTBOX, []); }
function queueSend(action, payload, label) {
  const ob = outbox(); ob.push({ id: Date.now() + '' + Math.random(), action, payload, label, at: new Date().toISOString() });
  if (!store.set(OUTBOX, ob)) toast('Could not keep the submission on this device. Please retry now.', 'err');
  renderNotices();
}
let flushing = false;
async function flushOutbox(manual) {
  if (flushing || !CFG.GAS_URL) return;
  const ob = outbox(); if (!ob.length) return;
  flushing = true; let sent = 0; const left = [];
  for (const item of ob) {
    try { await api(item.action, item.payload); sent++; }
    catch (e) {
      if (e.code === 'network' || e.code === 'busy') left.push(item);
      else toast(item.label + ': ' + e.message, 'err');
    }
  }
  store.set(OUTBOX, left); flushing = false;
  if (sent) { toast(sent + ' saved submission(s) sent to the server ✓'); loadPublic(); }
  else if (manual && left.length) toast('Still offline. The submission is safe on this device.', 'err');
  renderNotices();
}
window.addEventListener('online', () => flushOutbox());

/* =================== Status helpers =================== */
function attStatus(pid, day) {
  const m = (S.admin && S.admin.att[pid + '_d' + day]) || S.marks[pid + '_d' + day];
  if (m && m.status === 'present') return 'present';
  if (m && m.status === 'absent') return 'absent';
  const t = todayISO(), d = DAYS[day - 1].date;
  return d < t ? 'absent' : d === t ? 'pending' : 'upcoming';
}
const STATUS_LABEL = { present: 'Present', absent: 'Absent', pending: 'Pending', upcoming: 'Upcoming' };
const pill = (cls, txt) => `<span class="pill ${cls}">${esc(txt)}</span>`;
const statusPill = s => pill(s, STATUS_LABEL[s]);
function ttFor(day) { return (S.tt && S.tt[day] && S.tt[day].length) ? S.tt[day] : DEFAULT_TT[day]; }
function searchPeople(q, block) {
  const n = norm(q);
  return S.participants.filter(p => (!block || p.block === block) && (!n || norm(p.name + p.school + p.block + p.id).includes(n)));
}

function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;
  }

async function uploadBatch(items, progress) {
  let ok = 0;
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    progress && progress(`Uploading ${i + 1} of ${items.length}: ${it.file.name}…`);
    try {
      const data = await fileToB64(it.file);
      await api('uploadMaterial', { meta: { title: it.title, description: it.description, topic: it.topic, category: it.category || 'Other', order: it.order, published: it.published }, file: { name: it.file.name, mime: FILE_TYPES[ext(it.file.name)].mime, data } });
      ok++; it.done = true;
    } catch (e) { it.err = e.message; toast(it.file.name + ': ' + e.message, 'err'); }
  }
  progress && progress('');
  if (ok) toast(ok + ' file(s) uploaded ✓');
  await refreshAll();
  return ok;
}

/* ---------- Document viewer ---------- */
const V = { zoom: 1, page: 1, pages: 0, pdf: null, kind: '', blob: null, name: '', render: null, url: null };
const fileCache = new Map();
async function materialBlob(mt) {
  if (mt.localFile) return mt.localFile;
  if (mt.srcUrl) { const r = await fetch(mt.srcUrl); if (!r.ok) throw new Error('Could not load ' + mt.srcUrl); return r.blob(); }
  if (fileCache.has(mt.id)) return fileCache.get(mt.id);
  const j = await api('material', { id: mt.id });
  const b = b64ToBlob(j.data, j.mime);
  fileCache.set(mt.id, b);
  return b;
}
function fallbackHTML(mt, why) {
  return `<div class="vmsg"><h2 style="color:#fff">Preview is not available in the browser</h2><p>${why}</p><div class="row" style="justify-content:center"><button class="btn saff" id="vDl2">Download ${esc(mt.name)}</button><button class="btn sec" id="vExt">Open externally</button></div></div>`;
}
function bindFallback(mt, blob) {
  const d = $('#vDl2'); if (d) d.onclick = () => saveBlob(mt.name, blob);
  const o = $('#vExt'); if (o) o.onclick = () => { const u = URL.createObjectURL(blob); const w = window.open(u, '_blank', 'noopener'); if (!w) saveBlob(mt.name, blob); setTimeout(() => URL.revokeObjectURL(u), 60000); };
}
/* Global presentation viewer. openViewer(resource, fullScreen, present) is used by Training Materials,
   Import Documents and the Home banner; present=true is the Digital Board mode. */
function presentResource(mt) { openViewer(mt, true, true); }
function presentBanner() { openViewer({ id: 'banner', name: 'nmms-banner.jpg', title: 'Training-cum-Workshop for INOs under NMMS Scheme (2026–27)', srcUrl: 'assets/nmms-banner.jpg', noDownload: true }, true, true); }
async function openViewer(mt, full, present) {
  if (!mt) return;
  const vw = $('#viewer'), body = $('#vBody');
  vw.classList.toggle('present', !!present); V.present = !!present;
  if (V.url) URL.revokeObjectURL(V.url);
  Object.assign(V, { zoom: 1, page: 1, pages: 0, pdf: null, kind: '', blob: null, name: mt.name, render: null, url: null });
  $('#vTitle').textContent = mt.title || mt.name; $('#vPages').innerHTML = ''; $('#vDl').hidden = true;
  body.style.alignItems = 'flex-start';
  body.innerHTML = '<div class="vmsg"><span class="spin"></span> Loading…</div>';
  vw.hidden = false; document.body.style.overflow = 'hidden'; $('#vExit').focus();
  if (full) goFull();
  try {
    const blob = await materialBlob(mt); V.blob = blob;
    $('#vDl').hidden = !!mt.noDownload; $('#vDl').onclick = () => saveBlob(mt.name, blob);
    const e = ext(mt.name);
    if (e === 'pdf') {
      V.kind = 'pdf';
      await loadScript(LIB.pdfWorker); await loadScript(LIB.pdf);
      const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = LIB.pdfWorker;
      V.pdf = await lib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()) }).promise;
      V.pages = V.pdf.numPages;
      $('#vPages').innerHTML = `<button id="vPrev" aria-label="Previous page">‹</button><span id="vPg" style="min-width:64px;text-align:center"></span><button id="vNext" aria-label="Next page">›</button>`;
      $('#vPrev').onclick = () => { if (V.page > 1) { V.page--; V.render(); } };
      $('#vNext').onclick = () => { if (V.page < V.pages) { V.page++; V.render(); } };
      V.render = async () => {
        $('#vPg').textContent = V.page + ' / ' + V.pages;
        const pg = await V.pdf.getPage(V.page);
        const base = pg.getViewport({ scale: 1 });
        const fit = V.present ? Math.min(body.clientWidth / base.width, body.clientHeight / base.height) : Math.min((body.clientWidth - 32) / base.width, (body.clientHeight - 32) / base.height * 1.6, 3);
        const vp = pg.getViewport({ scale: Math.max(0.3, fit) * V.zoom });
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const c = document.createElement('canvas'); c.width = vp.width * dpr; c.height = vp.height * dpr; c.style.width = vp.width + 'px'; c.style.height = vp.height + 'px';
        await pg.render({ canvasContext: c.getContext('2d'), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null }).promise;
        body.innerHTML = ''; body.appendChild(c); body.scrollTop = 0;
      };
    } else if (blob.type.startsWith('image/')) {
      V.kind = 'img'; V.url = URL.createObjectURL(blob); body.style.alignItems = 'center';
      V.render = () => { body.innerHTML = `<img class="imgv" alt="${esc(mt.title)}" src="${V.url}" style="${V.zoom === 1 ? (V.present ? '' : 'max-height:calc(100vh - 120px)') : `max-width:none;max-height:none;width:${V.zoom * 100}%`}">`; };
    } else if (blob.type.startsWith('video/')) {
      V.kind = 'video'; V.url = URL.createObjectURL(blob); body.style.alignItems = 'center';
      V.render = () => {
        body.innerHTML = `<video controls playsinline preload="metadata" src="${V.url}" style="${V.present ? '' : 'max-width:100%;max-height:calc(100vh - 120px);'}background:#000"></video>`;
        $('video', body).onerror = () => { body.innerHTML = fallbackHTML(mt, 'This browser cannot play this video format. Download it and play it in a media player.'); bindFallback(mt, blob); };
      };
    } else if (e === 'docx') {
      V.kind = 'html';
      await loadScript(LIB.mammoth);
      const out = await window.mammoth.convertToHtml({ arrayBuffer: await blob.arrayBuffer() });
      const html = sanitizeHTML(out.value);
      V.render = () => { body.innerHTML = `<div class="doc" style="font-size:${V.zoom}rem">${html || '<p>This document has no readable text.</p>'}</div>`; };
    } else if (e === 'xlsx' || e === 'xls') {
      V.kind = 'html';
      await loadScript(LIB.xlsx);
      const wb = window.XLSX.read(await blob.arrayBuffer(), { type: 'array' });
      let sheet = wb.SheetNames[0];
      $('#vPages').innerHTML = wb.SheetNames.length > 1 ? `<select id="vSheet" style="min-height:38px;border-radius:6px" aria-label="Sheet">${wb.SheetNames.map(n => `<option>${esc(n)}</option>`).join('')}</select>` : '';
      if ($('#vSheet')) $('#vSheet').onchange = ev => { sheet = ev.target.value; V.render(); };
      V.render = () => { body.innerHTML = `<div class="doc" style="font-size:${V.zoom * 0.9}rem;max-width:none">${sanitizeHTML(window.XLSX.utils.sheet_to_html(wb.Sheets[sheet]))}</div>`; };
    } else {
      V.kind = 'none';
      const why = e === 'doc' ? 'Older Word (.doc) files cannot be shown in a browser. Download the file and open it in Word, Google Docs or WPS Office, or ask the organiser to upload a PDF or DOCX copy.'
        : 'PowerPoint files cannot be shown in a browser. Download the file and open it in PowerPoint, Google Slides or WPS Office, or ask the organiser to upload a PDF copy.';
      V.render = () => { body.innerHTML = fallbackHTML(mt, why); bindFallback(mt, blob); };
    }
    await V.render(); updZoom();
  } catch (err) {
    V.kind = 'none'; updZoom();
    body.innerHTML = `<div class="vmsg"><h2 style="color:#fff">The document could not be opened</h2><p>${esc(err.message || String(err))}</p>${V.blob ? '<div class="row" style="justify-content:center"><button class="btn saff" id="vDl2">Download instead</button></div>' : ''}</div>`;
    if (V.blob) bindFallback(mt, V.blob);
  }
}
function updZoom() { $('#vZoom').textContent = Math.round(V.zoom * 100) + '%'; const n = V.kind === 'none' || V.kind === 'video'; $('#vZoomIn').hidden = n; $('#vZoomOut').hidden = n; $('#vZoom').hidden = n; }
$('#vZoomIn').onclick = () => { V.zoom = Math.min(4, +(V.zoom + 0.25).toFixed(2)); updZoom(); V.render && V.render(); };
$('#vZoomOut').onclick = () => { V.zoom = Math.max(0.5, +(V.zoom - 0.25).toFixed(2)); updZoom(); V.render && V.render(); };
function goFull() { const v = $('#viewer'); if (document.fullscreenElement) return; const fn = v.requestFullscreen || v.webkitRequestFullscreen; if (!fn) return; try { const p = fn.call(v); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
$('#vFull').onclick = () => { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); else goFull(); };
document.addEventListener('fullscreenchange', () => { $('#vFull').textContent = document.fullscreenElement ? 'Exit Full Screen' : 'Full Screen'; setTimeout(() => V.render && V.kind === 'pdf' && V.render(), 120); });
function closeViewer() { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); $('#viewer').hidden = true; $('#viewer').classList.remove('present'); $('#vBody').innerHTML = ''; document.body.style.overflow = ''; V.pdf = null; if (V.url) { URL.revokeObjectURL(V.url); V.url = null; } }
$('#vExit').onclick = closeViewer;
document.addEventListener('keydown', e => {
  if ($('#viewer').hidden) { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); return; }
  if (e.key === 'Escape' && !document.fullscreenElement) closeViewer();
  if (V.kind === 'pdf' && (e.key === 'ArrowRight' || e.key === 'PageDown') && V.page < V.pages) { V.page++; V.render(); }
  if (V.kind === 'pdf' && (e.key === 'ArrowLeft' || e.key === 'PageUp') && V.page > 1) { V.page--; V.render(); }
});

    const prog = () => { const n = QUESTIONS.slice(0, 11).filter(q => q.t === 'multi' ? (A['q' + q.n] || []).length : A['q' + q.n] !== undefined && A['q' + q.n] !== null).length; $('#tProg').textContent = n + ' of 11 required questions answered'; };

      T.busy = true; this.render(m);
      try {

        S.testmarks[T.pid + '_' + type] = { pid: T.pid, type }; loadPublic();

  if (F.status === 'today-missing') rows = rows.filter(r => td && r.days[td - 1].st !== 'present');
  if (F.status === 'all3') rows = rows.filter(r => r.present === 3);
  if (F.status === 'partial') rows = rows.filter(r => r.present > 0 && r.present < 3);
  if (F.status === 'none') rows = rows.filter(r => r.present === 0);

function testRows() {
  const F = App.dash.f2;
  let rows = filterPeople(F).map(testDetail);
  if (F.status === 'pre-pending') rows = rows.filter(r => !r.pre);
  else if (F.status === 'post-pending') rows = rows.filter(r => !r.post);
  else if (F.status) rows = rows.filter(r => r.status === F.status);
  return sortRows(rows, App.dash.sort.test);
}
function sortRows(rows, s) {
  if (!s) return rows;
  return rows.slice().sort((a, b) => {
    const x = a[s.c], y = b[s.c];
    if (x === '' && y !== '') return 1; if (y === '' && x !== '') return -1;
    const c = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'en', { numeric: true });
    return s.d * c;
  });
}

/* Exports */
function csvOf(aoa) { return '﻿' + aoa.map(r => r.map(v => { v = String(v ?? ''); if (/^[=+\-@]/.test(v)) v = "'" + v; return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\r\n'); }
async function saveTable(base, fmt, sheets) {
  if (fmt === 'csv') { saveBlob(base + '.csv', new Blob([csvOf(sheets[0][1])], { type: 'text/csv;charset=utf-8' })); return; }
  try {
    await loadScript(LIB.xlsx);
    const X = window.XLSX, wb = X.utils.book_new();
    sheets.forEach(([name, aoa]) => { const ws = X.utils.aoa_to_sheet(aoa); ws['!cols'] = aoa[0].map((h, i) => ({ wch: Math.min(48, Math.max(String(h).length + 2, ...aoa.slice(1, 60).map(r => String(r[i] ?? '').length + 1))) })); X.utils.book_append_sheet(wb, ws, name); });
    saveBlob(base + '.xlsx', new Blob([X.write(wb, { bookType: 'xlsx', type: 'array' })], { type: FILE_TYPES.xlsx.mime }));
  } catch (e) { toast('Excel download needs the internet to load its library. Use Export CSV instead.', 'err'); }
}
function fileSuffix(F) { return (F.block ? '_' + F.block.replace(/\s+/g, '') : '') + '_' + todayISO(); }
function exportAtt(rows, fmt) {
  const head = ['S.No.', 'Participant ID', 'Participant Name', 'Mobile', 'School / Office', 'Block'];
  DAYS.forEach(d => head.push(`Day ${d.n} (${d.date}) Status`, `Day ${d.n} Check-in`, `Day ${d.n} Photo`));
  head.push('Days Present', 'Attendance Status', 'Last Check-in', 'Remarks');
  const aoa = [head].concat(rows.map((r, i) => {
    const o = [i + 1, r.id, r.name, r.mobile, r.school, r.block];
    r.days.forEach(x => o.push(STATUS_LABEL[x.st], x.at ? fmtDT(x.at) : '', x.photo ? 'Yes (private)' : 'No'));
    o.push(r.present, r.overall, r.last ? fmtDT(r.last) : '', r.remarks);
    return o;
  }));
  saveTable('NMMS_Attendance_Details' + fileSuffix(App.dash.f1), fmt, [['Attendance Details', aoa]]);
}
function exportTests(rows, fmt) {
  const head = ['S.No.', 'Participant ID', 'Participant Name', 'Mobile', 'School / Office', 'Block', 'Pre-Test Score', 'Pre-Test Max', 'Pre-Test %', 'Pre-Test Submitted', 'Post-Test Score', 'Post-Test Max', 'Post-Test %', 'Post-Test Submitted', 'Improvement (Post − Pre)', 'Status'];
  const aoa = [head].concat(rows.map((r, i) => [i + 1, r.id, r.name, r.mobile, r.school, r.block, r.preScore, r.pre ? MAX_MARKS : '', r.prePct, r.preAt ? fmtDT(r.preAt) : '', r.postScore, r.post ? MAX_MARKS : '', r.postPct, r.postAt ? fmtDT(r.postAt) : '', r.diff, r.status]));
  const qwise = type => [['Participant ID', 'Participant Name', 'Block'].concat(QUESTIONS.map(q => `Q${q.n} (${q.m})`), ['Total /20', 'Submitted'])]
    .concat(rows.filter(r => r[type]).map(r => [r.id, r.name, r.block].concat(r[type].marks, [r[type].total, fmtDT(r[type].at)])));
  saveTable('NMMS_PrePost_Test_Details' + fileSuffix(App.dash.f2), fmt, [['Pre & Post Details', aoa], ['Pre-Test Q-wise', qwise('pre')], ['Post-Test Q-wise', qwise('post')]]);
}

async function photoModal(b, key) {

function correctModal(pid, dn) {
  const p = S.pmap[pid];
  showModal(`<h2>Correct attendance</h2><p><b>${esc(p.name)}</b> · ${DAYS[dn - 1].label} (${DAYS[dn - 1].long})<br><span class="muted small">Current status: ${esc(STATUS_LABEL[attStatus(pid, dn)])}</span></p>

    <div class="field"><label for="cr">Reason (saved in Remarks and the audit log)</label><textarea class="input" id="cr" maxlength="300" required></textarea></div><div id="cErr"></div>

VIEWS.dashboard = { render(m) {
  if (!adminGate(m)) return;
  const D = App.dash, parts = S.participants, N = parts.length, td = todayDay();
  const pres = d => parts.filter(p => attStatus(p.id, d) === 'present').length;
  const elapsed = DAYS.filter(d => d.date <= todayISO()).map(d => d.n);
  const presTotal = elapsed.reduce((s, d) => s + pres(d), 0), possible = N * elapsed.length;
  const pre = parts.map(p => S.admin.pre[p.id]).filter(Boolean), post = parts.map(p => S.admin.post[p.id]).filter(Boolean);
  const avg = a => a.length ? (a.reduce((s, t) => s + t.total, 0) / a.length).toFixed(1) : '—';
  const both = parts.filter(p => S.admin.pre[p.id] && S.admin.post[p.id]);
  const imp = both.length ? (both.reduce((s, p) => s + S.admin.post[p.id].total - S.admin.pre[p.id].total, 0) / both.length) : null;
  const k = (l, v, s, c) => `<div class="kpi ${c || ''}"><span>${l}</span><b>${v}</b>${s ? `<small>${s}</small>` : ''}</div>`;
  const tabs = [['att', 'Attendance Details'], ['test', 'Pre-Test & Post-Test Details'], ['timetable', 'Timetable Editor'], ['settings', 'Settings & Audit Log']];
  if (!tabs.some(t => t[0] === D.tab)) D.tab = 'att';
  m.innerHTML = `<div class="page-head"><div><h1>Admin Dashboard</h1><p>Last updated ${App.adminLoadedAt ? esc(fmtT(App.adminLoadedAt.toISOString())) : ''}</p></div>
   <div class="row no-print"><button class="btn sec" id="dRefresh">Refresh</button></div></div>
  <div class="kpis">
    ${k('Registered participants', N, 'approved list')}
    ${k('Attendance today', td ? pres(td) : '—', td ? DAYS[td - 1].label + ' · ' + (N ? Math.round(pres(td) * 100 / N) : 0) + '%' : 'Not a training day')}
    ${k('Attendance by day', DAYS.map(d => pres(d.n)).join(' · '), 'Day 1 · Day 2 · Day 3')}
    ${k('Attendance %', possible ? Math.round(presTotal * 100 / possible) + '%' : '—', possible ? `${presTotal} of ${possible} participant-days so far` : 'No training day has started')}
    ${k('Pre-Test submitted', pre.length, (N - pre.length) + ' pending')}
    ${k('Pre-Test average', avg(pre) + (pre.length ? '<small style="font-size:.9rem">/20</small>' : ''), pre.length ? 'submitted only' : 'No submissions yet')}
    ${k('Post-Test submitted', post.length, (N - post.length) + ' pending')}
    ${k('Post-Test average', avg(post) + (post.length ? '<small style="font-size:.9rem">/20</small>' : ''), post.length ? 'submitted only' : 'No submissions yet')}
    ${k('Both tests completed', both.length, 'of ' + N)}
    ${k('Average improvement', imp === null ? '—' : (imp >= 0 ? '+' : '') + imp.toFixed(1), imp === null ? 'Needs both tests' : 'marks (Post − Pre)', imp > 0 ? 'good' : '')}
  </div>
  <div class="subtabs no-print" role="tablist">${tabs.map(([id, l]) => `<button role="tab" data-tab="${id}" aria-selected="${D.tab === id}">${l}</button>`).join('')}</div>
  <section id="dPanel" style="display:grid;gap:12px"></section>`;
  $('#dRefresh').onclick = async () => { $('#dRefresh').disabled = true; try { await Promise.all([loadPublic(), loadAdmin()]); toast('Updated'); } catch (e) { toast(e.message, 'err'); } };
  $$('[data-tab]', m).forEach(b => b.onclick = () => { D.tab = b.dataset.tab; this.render(m); });
  const P = $('#dPanel');
  if (D.tab === 'att') renderAttTable(P);
  else if (D.tab === 'test') renderTestTable(P);
  else if (D.tab === 'timetable') renderTTEditor(P);
  else renderSettings(P);
}, live: true };

function renderTTEditor(P) {
  const D = App.dash;
  if (!D.ttRows) D.ttRows = JSON.parse(JSON.stringify(ttFor(D.ttDay)));
  const rows = D.ttRows;
  P.innerHTML = `<div class="row" style="justify-content:space-between"><h2>Timetable Editor</h2><div class="seg">${DAYS.map(d => `<button data-ttd="${d.n}" aria-pressed="${d.n === D.ttDay}">${d.label}<small>${d.long}</small></button>`).join('')}</div></div>
   <p class="muted small" style="margin:0">Times are in 24-hour format. Leave End empty for an open-ended item (for example the 4:30 tea break). Tick TBC only when the time is not yet confirmed.</p>
   <div class="tbl-wrap"><table class="wide tt-edit"><thead><tr><th>#</th><th>Start</th><th>End</th><th>Topic</th><th>TBC</th><th></th></tr></thead><tbody>
   ${rows.map((x, i) => `<tr data-i="${i}"><td>${i + 1}</td><td><input class="input" type="time" data-f="start" value="${esc(x.start)}" aria-label="Start time"></td><td><input class="input" type="time" data-f="end" value="${esc(x.end)}" aria-label="End time"></td><td><input class="input" data-f="topic" value="${esc(x.topic)}" style="min-width:220px" aria-label="Topic"></td><td><input type="checkbox" data-f="tbc" ${x.tbc ? 'checked' : ''} aria-label="Time to be confirmed" style="width:20px;height:20px"></td>
     <td style="white-space:nowrap"><button class="btn sm sec" data-mv="-1" aria-label="Move up">↑</button> <button class="btn sm sec" data-mv="1" aria-label="Move down">↓</button> <button class="btn sm sec" data-del aria-label="Delete row">✕</button></td></tr>`).join('')}
   </tbody></table></div>
   <div class="row"><button class="btn sec" id="ttAdd">Add session</button><button class="btn" id="ttSave">Save ${DAYS[D.ttDay - 1].label}</button><button class="btn sec" id="ttReset">Reload saved version</button></div>`;
  $$('[data-ttd]', P).forEach(b => b.onclick = () => { D.ttDay = +b.dataset.ttd; D.ttRows = null; renderTTEditor(P); });
  P.querySelector('tbody').addEventListener('input', e => { const t = e.target, i = +t.closest('tr').dataset.i; rows[i][t.dataset.f] = t.type === 'checkbox' ? t.checked : t.value; });
  P.querySelector('tbody').addEventListener('change', e => { const t = e.target, i = +t.closest('tr').dataset.i; rows[i][t.dataset.f] = t.type === 'checkbox' ? t.checked : t.value; });
  $$('[data-mv]', P).forEach(b => b.onclick = () => { const i = +b.closest('tr').dataset.i, j = i + +b.dataset.mv; if (j < 0 || j >= rows.length) return; [rows[i], rows[j]] = [rows[j], rows[i]]; renderTTEditor(P); });
  $$('[data-del]', P).forEach(b => b.onclick = () => { rows.splice(+b.closest('tr').dataset.i, 1); renderTTEditor(P); });
  $('#ttAdd').onclick = () => { rows.push(r('New session')); renderTTEditor(P); };
  $('#ttReset').onclick = () => { D.ttRows = null; renderTTEditor(P); };
  $('#ttSave').onclick = async () => {
    if (rows.some(x => !x.topic.trim())) { toast('Every session needs a topic.', 'err'); return; }
    $('#ttSave').disabled = true;
    try { await api('saveTimetable', { day: D.ttDay, rows }); toast(DAYS[D.ttDay - 1].label + ' timetable saved'); D.ttRows = null; await loadPublic(); }
    catch (e) { toast(e.message, 'err'); $('#ttSave').disabled = false; }
  };
}
function renderSettings(P) {
  const st = S.admin.settings || {};
  P.innerHTML = `<div class="grid2"><form class="card" id="sf" style="display:grid;gap:12px"><h2>Assessment settings</h2>
     <div class="fgrid"><div class="field"><label for="sPreO">Pre-Test</label><select class="input" id="sPreO"><option value="yes">Open</option><option value="no" ${st.preOpen === 'no' ? 'selected' : ''}>Closed</option></select></div>
     <div class="field"><label for="sPostO">Post-Test</label><select class="input" id="sPostO"><option value="yes">Open</option><option value="no" ${st.postOpen === 'no' ? 'selected' : ''}>Closed</option></select></div></div>
     <div class="field"><label for="sPreU">Optional DIET Google Form link — Pre-Test</label><input class="input" id="sPreU" type="url" placeholder="https://forms.gle/…" value="${esc(st.preFormUrl || '')}"></div>
     <div class="field"><label for="sPostU">Optional DIET Google Form link — Post-Test</label><input class="input" id="sPostU" type="url" placeholder="https://forms.gle/…" value="${esc(st.postFormUrl || '')}"></div>
     <div id="sErr"></div><div><button class="btn" id="sSave">Save settings</button></div></form>
   <div class="card" style="display:grid;gap:10px"><h2>Audit log</h2><p class="muted small" style="margin:0">Latest 300 administrative events (logins, corrections, edits, uploads).</p>
     <div class="tbl-wrap" style="max-height:420px;overflow:auto"><table><thead><tr><th>Time</th><th>Action</th><th>Target</th><th>Details</th></tr></thead><tbody>${(S.admin.audit || []).map(a => `<tr><td style="white-space:nowrap">${esc(fmtDT(a.at))}</td><td>${esc(a.action)}</td><td>${esc(a.target)}</td><td class="small">${esc(a.details)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">No events yet.</td></tr>'}</tbody></table></div></div></div>`;
  $('#sf').onsubmit = async e => {
    e.preventDefault(); $('#sSave').disabled = true;
    try { await api('saveSettings', { settings: { preOpen: $('#sPreO').value, postOpen: $('#sPostO').value, preFormUrl: $('#sPreU').value.trim(), postFormUrl: $('#sPostU').value.trim() } }); toast('Settings saved'); await Promise.all([loadPublic(), loadAdmin()]); }
    catch (err) { $('#sErr').innerHTML = `<div class="notice err">${esc(err.message)}</div>`; $('#sSave').disabled = false; }
  };
}

/* ---------- Import Documents ---------- */
VIEWS.import = { live: true, render(m) {
  if (!adminGate(m)) return;
  const I = App.imp, all = (S.admin.materials || []).slice().sort((a, b) => a.day - b.day || String(a.topic).localeCompare(String(b.topic)) || a.order - b.order);
  const defTopic = I.topic || (TOPIC_MAP[App.matTopic] ? App.matTopic : MAT_DAYS[(todayDay() || 1) - 1].topics[0].id);
  m.innerHTML = `<div class="page-head"><div><h1>Import Documents</h1><p>Batch upload into the day-wise topic folders · PDF, DOC/DOCX, PPT/PPTX, XLS/XLSX, JPG, PNG, WebP (10 MB) · MP4, WebM (25 MB)</p></div><a class="btn sec" href="#materials">Open Training Materials</a></div>
  <div class="card" style="display:grid;gap:12px">
    <div class="field" style="max-width:420px"><label for="impTopic">Default folder for new files</label><select class="input" id="impTopic">${topicOptions(defTopic)}</select></div>
    <div class="drop" id="drop"><p style="margin:0 0 10px"><b>Drag files here</b> or choose them (several at once is fine)</p><button class="btn" id="pick">Choose files</button><input type="file" id="files" multiple hidden accept="${ACCEPT}"></div>
    ${I.queue.length ? `<div class="tbl-wrap"><table class="wide"><thead><tr><th>File</th><th>Title</th><th>Description</th><th>Folder</th><th>Order</th><th>Publish</th><th></th></tr></thead><tbody>
      ${I.queue.map((q, i) => `<tr data-q="${i}"><td><b>${esc(q.file.name)}</b><br><span class="small muted">${fmtSize(q.file.size)}</span>${q.err ? `<div class="small" style="color:var(--red)">${esc(q.err)}</div>` : ''}</td>
        <td><input class="input" data-f="title" value="${esc(q.title)}" style="min-width:180px" aria-label="Title"></td><td><input class="input" data-f="description" value="${esc(q.description)}" aria-label="Description"></td>
        <td><select class="input" data-f="topic" aria-label="Folder" style="min-width:220px">${topicOptions(q.topic)}</select></td>
        <td><input class="input" type="number" min="0" max="999" data-f="order" value="${q.order}" style="width:80px" aria-label="Display order"></td>
        <td><input type="checkbox" data-f="published" ${q.published ? 'checked' : ''} style="width:20px;height:20px" aria-label="Publish"></td>
        <td style="white-space:nowrap">${q.err ? '' : `<button class="btn sm sec" data-prev="${i}">Preview</button>`} <button class="btn sm sec" data-rm="${i}">Remove</button></td></tr>`).join('')}</tbody></table></div>
      <div class="row"><button class="btn green" id="upAll" ${I.busy || !I.queue.some(q => !q.err) ? 'disabled' : ''}>${I.busy ? '<span class="spin"></span> ' + esc(I.busy) : 'Upload ' + I.queue.filter(q => !q.err).length + ' file(s)'}</button><button class="btn sec" id="clrQ" ${I.busy ? 'disabled' : ''}>Clear list</button></div>` : ''}
  </div>
  <h2>All uploaded resources</h2>
  ${all.length ? `<div class="tbl-wrap"><table class="wide"><thead><tr><th>Day</th><th>Folder</th><th>Order</th><th>Title</th><th>Type</th><th>Status</th><th>Actions</th></tr></thead><tbody>
   ${all.map(x => `<tr><td>${DAYS[x.day - 1] ? DAYS[x.day - 1].label : esc(x.day)}</td><td class="small"><a href="#materials/${esc(x.topic)}">${esc((TOPIC_MAP[x.topic] || {}).t || 'No folder')}</a></td><td class="num">${x.order}</td><td><b>${esc(x.title)}</b>${x.description ? `<br><span class="small muted">${esc(x.description)}</span>` : ''}</td>
     <td class="small">${x.kind === 'link' ? 'Link' : `${esc(matType(x))}<br>${fmtSize(x.size)}`}</td><td>${x.published ? pill('present', 'Published') : pill('neutral', 'Draft')}</td>
     <td style="white-space:nowrap">${x.kind === 'link' ? `<a class="btn sm sec" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer external">Open ↗</a>` : `<button class="btn sm sec" data-mview="${esc(x.id)}">Preview</button> <button class="btn sm saff" data-mpres="${esc(x.id)}">Present on Digital Board</button>`} <button class="btn sm sec" data-medit="${esc(x.id)}">Edit</button> ${x.kind === 'link' ? '' : `<button class="btn sm sec" data-mrep="${esc(x.id)}">Replace</button>`} <button class="btn sm danger" data-mdel="${esc(x.id)}">Delete</button></td></tr>`).join('')}</tbody></table></div>`
    : '<div class="empty">No materials uploaded yet. Choose files above to add the first one.</div>'}
  <input type="file" id="repFile" hidden accept="${ACCEPT}">`;
  $('#impTopic').onchange = e => { I.topic = e.target.value; };
  const add = files => {
    const topic = $('#impTopic').value; I.topic = topic;
    const base = topicItems(topic).reduce((mx, y) => Math.max(mx, y.order), 0);
    [...files].forEach((f, i) => I.queue.push({ file: f, title: f.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' '), description: '', topic, order: base + (i + 1) * 10, published: true, err: checkLocalFile(f) }));
    this.render(m);
  };
  $('#pick').onclick = () => $('#files').click();
  $('#files').onchange = e => { add(e.target.files); };
  const dz = $('#drop');
  dz.ondragover = e => { e.preventDefault(); dz.classList.add('over'); };
  dz.ondragleave = () => dz.classList.remove('over');
  dz.ondrop = e => { e.preventDefault(); dz.classList.remove('over'); add(e.dataTransfer.files); };
  const upd = (tr, t) => { const q = I.queue[+tr.dataset.q]; if (!t.dataset.f) return; q[t.dataset.f] = t.type === 'checkbox' ? t.checked : t.dataset.f === 'order' ? +t.value : t.value; };
  $$('tr[data-q]', m).forEach(tr => { tr.addEventListener('input', e => upd(tr, e.target)); tr.addEventListener('change', e => upd(tr, e.target)); });
  $$('[data-rm]', m).forEach(b => b.onclick = () => { I.queue.splice(+b.dataset.rm, 1); this.render(m); });
  $$('[data-prev]', m).forEach(b => b.onclick = () => { const q = I.queue[+b.dataset.prev]; openViewer({ id: 'local', name: q.file.name, title: q.title + ' (preview)', localFile: q.file }, false); });
  const clr = $('#clrQ'); if (clr) clr.onclick = () => { I.queue = []; this.render(m); };
  const up = $('#upAll');
  if (up) up.onclick = async () => {
    const items = I.queue.filter(q => !q.err);
    I.busy = 'Uploading…'; this.render(m);
    await uploadBatch(items, msg => { I.busy = msg; const b = $('#upAll'); if (b && msg) b.innerHTML = '<span class="spin"></span> ' + esc(msg); });
    I.busy = ''; I.queue = I.queue.filter(q => !q.done);
    this.render(m);
  };
  const find = id => all.find(x => x.id === id);
  $$('[data-mview]', m).forEach(b => b.onclick = () => openViewer(find(b.dataset.mview), false));
  $$('[data-mpres]', m).forEach(b => b.onclick = () => presentResource(find(b.dataset.mpres)));
  $$('[data-medit]', m).forEach(b => b.onclick = () => { const x = find(b.dataset.medit); x.kind === 'link' ? linkModal(x.topic, x) : editMaterialModal(x); });
  $$('[data-mrep]', m).forEach(b => b.onclick = () => replaceMaterialFlow(find(b.dataset.mrep)));
  $$('[data-mdel]', m).forEach(b => b.onclick = () => deleteMaterialModal(find(b.dataset.mdel)));
} };

let scale = store.get('nmms26_scale', 1);
const applyScale = () => { document.documentElement.style.setProperty('--scale', scale); store.set('nmms26_scale', scale); };
$('#fUp').onclick = () => { scale = Math.min(1.8, +(scale + 0.1).toFixed(2)); applyScale(); };
$('#fDown').onclick = () => { scale = Math.max(0.8, +(scale - 0.1).toFixed(2)); applyScale(); };
applyScale();
$('#boardBtn').onclick = presentBanner;
route();
(async () => {
  await loadPublic();
  if (App.token) { try { await loadAdmin(); } catch (e) { App.token = null; store.sset('nmms26_tok', null); } }
  flushOutbox();
})();
setInterval(() => { if (!document.hidden && CFG.GAS_URL && !['attendance', 'pre-test', 'post-test'].includes(App.route)) loadPublic(); }, 60000);
</script>
