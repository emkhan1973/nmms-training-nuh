# Publishes the static site in site/ to GitHub Pages on every push to main.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to publish phone numbers or the admin password
        run: |
          if grep -rEn '\b[6-9][0-9]{9}\b' site/; then echo "::error::A 10-digit mobile number was found in site/"; exit 1; fi
          if grep -rn 'ADMIN_PASSWORD\s*[:=]' site/; then echo "::error::Admin password found in site/"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
